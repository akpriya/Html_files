<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta HTTP-EQUIV="Content-type" CONTENT="text/html; charset=UTF-8">
    <title>Web to Lead Form</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css"/>
    <script src="script.js"></script>
</head>
<body>
    <h1>Create Lead</h1>
    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00D5g00000LS0Jn" method="POST" onsubmit="beforeSubmit()">
        <input type="hidden" name="oid" value="00D5g00000LS0Jn">
        <input type="hidden" name="retURL" value="https://akpriya.github.io/HTML-files/thanks.html"> 
        <input type="hidden" name="00Ng500000SiSy9" class="outputdate" >

        <label for="first_name">First Name</label><input  id="first_name" maxlength="40" name="first_name" size="20" type="text" required /><br>

        <label for="last_name">Last Name</label><input  id="last_name" maxlength="80" name="last_name" size="20" type="text" required /><br>

        <label for="email">Email</label><input  id="email" maxlength="80" name="email" size="20" type="text" required /><br>
        
        <label>Lead Date:</label>
        <input id="LeadDate" type="date" class="inputdate" required/>
        <!-- <span class="dateInput dateOnlyInput"><input  id="00Ng500000SiSy9" name="00Ng500000SiSy9" size="12" type="text" /></span><br> -->

        <input type="hidden"  id="lead_source" name="lead_source" value="Web" /><br>
        <input type="submit" name="submit" class="submit">
    </form>
</body>
</html>
